# Builds, signs and uploads a release. Runs only when started by hand (Actions > Release > Run workflow).
# The result is a DRAFT GitHub release: review it, then press Publish. Apps only see an update after that.
# Setup (secrets, variables, keys) is in docs/releasing.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 1.2.0"
        required: true
        type: string
      platforms:
        description: "What to build"
        type: choice
        options: [both, macos, windows]
        default: both
      prerelease:
        description: "Mark as pre-release (apps do not update to it)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}
  # Monotonic build number for CFBundleVersion (Sparkle compares it).
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check version and tag
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like 1.2.0 or 1.2.0-beta.1, got '$VERSION'"; exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}" "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"; exit 1
          fi

  macos:
    needs: check
    if: inputs.platforms != 'windows'
    # The project needs Xcode 27. GitHub's macOS 26 image tops out at Xcode 26, the xcode-27 image has 27.
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      PROJECT: NativeScreen/NativeScreen.xcodeproj
      APP: Native Screen.app
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=()
          for name in P12 P12_PASSWORD API_KEY API_KEY_ID API_ISSUER SPARKLE_KEY TEAM_ID SPARKLE_PUBLIC_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets or variables: ${missing[*]} (see docs/releasing.md)"; exit 1
          fi

      - name: Select Xcode
        run: |
          # Picks the newest Xcode 27+ on the runner.
          xcode=$(ls -d /Applications/Xcode_2[7-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$xcode" ] && sudo xcode-select -s "$xcode"
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt 27 ]; then
            echo "::error::Xcode 27 or newer is needed"; ls -d /Applications/Xcode*.app; exit 1
          fi

      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" -scheme NativeScreen -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/NativeScreen.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: |\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/NativeScreen.xcarchive" || { tail -100 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Export Developer ID app
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NativeScreen.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          app="$RUNNER_TEMP/export/$APP"
          codesign --verify --deep --strict --verbose=2 "$app"
          key=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$app/Contents/Info.plist")
          [ -n "$key" ] || { echo "::error::SUPublicEDKey is empty in the built app"; exit 1; }
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Notarize and staple the app
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app.zip" \
            --key "$API_KEY_PATH" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait --timeout 30m
          xcrun stapler staple "$APP_PATH"

      - name: Build, sign, notarize and staple the DMG
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir -p dist "$RUNNER_TEMP/dmg"
          ditto "$APP_PATH" "$RUNNER_TEMP/dmg/$APP"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "Native Screen" -srcfolder "$RUNNER_TEMP/dmg" -fs HFS+ -format UDZO -ov dist/NativeScreen.dmg
          codesign --sign "Developer ID Application" --keychain "$KEYCHAIN" --timestamp dist/NativeScreen.dmg
          xcrun notarytool submit dist/NativeScreen.dmg \
            --key "$API_KEY_PATH" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait --timeout 30m
          xcrun stapler staple dist/NativeScreen.dmg
          spctl --assess --type open --context context:primary-signature --verbose dist/NativeScreen.dmg

      - name: Generate the Sparkle appcast
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Same Sparkle version as the app (Package.resolved).
          sparkle=$(python3 -c "import json;d=json.load(open('NativeScreen/NativeScreen.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'));print(next(p['state']['version'] for p in d['pins'] if p['identity']=='sparkle'))")
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle/Sparkle-$sparkle.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          base="https://github.com/${{ github.repository }}/releases"
          echo "$SPARKLE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "$base/download/$TAG/" \
            --full-release-notes-url "$base/tag/$TAG" \
            --link "https://github.com/${{ github.repository }}" \
            -o dist/appcast.xml dist
          cat dist/appcast.xml

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/NativeScreen.dmg
            dist/appcast.xml
          if-no-files-found: error

      - name: Clean up keychain
        if: always()
        run: |
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  windows:
    needs: check
    if: inputs.platforms != 'macos'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json

      - name: Publish
        run: |
          # The file version only takes numbers, so a pre-release suffix is dropped there.
          $numeric = $env:VERSION -replace '-.*$', ''
          dotnet publish windows/src/NativeScreen.App/NativeScreen.App.csproj `
            -c Release -p:Platform=x64 -r win-x64 --self-contained `
            -p:Version=$env:VERSION -p:FileVersion=$numeric.$env:BUILD_NUMBER `
            -o publish --nologo
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }

      # Unsigned for now: Windows shows a SmartScreen warning on first run (docs/releasing.md explains it to users).
      # When SignPath Foundation approves the project, sign publish/*.exe here, before packing, and pass
      # --signTemplate or --azureTrustedSignFile to vpk so Setup.exe and the update package are signed too.
      - name: Pack with Velopack
        run: |
          dotnet tool install -g vpk --version 1.2.161
          vpk pack `
            --packId NativeScreen `
            --packVersion $env:VERSION `
            --packDir publish `
            --mainExe NativeScreen.App.exe `
            --packTitle "Native Screen" `
            --packAuthors "Duc Trung Mai" `
            --icon windows/src/NativeScreen.App/Assets/app.ico `
            --channel win `
            --outputDir releases
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed" }
          Get-ChildItem releases

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: releases/*
          if-no-files-found: error

  release:
    needs: [macos, windows]
    # Runs when every requested platform built (a skipped platform is fine, a failed one is not).
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          flags=(--draft --target "${{ github.sha }}" --title "Native Screen $VERSION" --generate-notes)
          [ "${{ inputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" --repo "${{ github.repository }}" "${flags[@]}" assets/*
          echo "Draft created: https://github.com/${{ github.repository }}/releases (review, then Publish)" >> "$GITHUB_STEP_SUMMARY"
