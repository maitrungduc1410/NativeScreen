[package]
name = "nativescreen"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.14.0", default-features = false, features = ["tokio", "screencast"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
evdev = "0.13.2"
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
libc = "0.2.191"
pipewire = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
jsonschema = "0.61.2"
